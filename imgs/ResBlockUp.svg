  <text x="360" y="496" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#dbeafe">element-wise add</text>

  <line x1="360" y1="508" x2="360" y2="540" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="260" y="542" width="200" height="52" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="564" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">output</text>
  <text x="360" y="582" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">C = filters_out, H×2, W×2</text>

  <rect x="60" y="660" width="14" height="14" rx="3" fill="#e8f0f8" stroke="#3a6ea5"/>
  <text x="84" y="672" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Main path</text>
  <rect x="200" y="660" width="14" height="14" rx="3" fill="#f5f0e4" stroke="#9a7b3a"/>
  <text x="224" y="672" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Shortcut (projection)</text>
  <rect x="420" y="660" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="444" y="672" font-family="Segoe UI, sans-serif" font-size="12" fill="#333">Residual add</text>

  <text x="360" y="720" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#888">Source: Main.ipynb / pipeline.models_skip.ResBlockUp</text>
