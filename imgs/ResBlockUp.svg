  </defs>

  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">ResBlockUp — Forward</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#666">main (conv1→conv2) + shortcut (conv3) → residual add</text>

  <rect x="260" y="80" width="200" height="52" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="360" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">input x</text>
  <text x="360" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#666">C = filters_in</text>

  <!-- fork: orthogonal, separate stems -->
  <path d="M 300 132 L 300 155 L 160 155 L 160 178" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 420 132 L 420 155 L 560 155 L 560 178" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="160" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#2a5a8a">MAIN</text>
  <rect x="60" y="180" width="200" height="56" rx="8" fill="#e8f0f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="160" y="203" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">conv1_block</text>
  <text x="160" y="221" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#444">Conv3x3 → Upsample×2 → BN → LReLU</text>

  <line x1="160" y1="236" x2="160" y2="258" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="60" y="260" width="200" height="56" rx="8" fill="#e8f0f8" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="160" y="283" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">conv2_block</text>
  <text x="160" y="301" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#444">Conv3x3 → BN (→ filters_out)</text>

  <line x1="160" y1="316" x2="160" y2="338" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="60" y="340" width="200" height="48" rx="8" fill="#f0f0ee" stroke="#888" stroke-width="1.2"/>
  <text x="160" y="360" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">optional LReLU</text>
  <text x="160" y="376" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#666">if self.act</text>

  <text x="560" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#6a5a2a">SHORTCUT</text>
  <rect x="460" y="180" width="200" height="56" rx="8" fill="#f5f0e4" stroke="#9a7b3a" stroke-width="1.5"/>
  <text x="560" y="203" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">conv3_block</text>
  <text x="560" y="221" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#444">Conv3x3 → Upsample×2 → BN → LReLU</text>

  <line x1="560" y1="236" x2="560" y2="338" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="460" y="340" width="200" height="48" rx="8" fill="#f0f0ee" stroke="#888" stroke-width="1.2"/>
  <text x="560" y="360" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">optional LReLU</text>
  <text x="560" y="376" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#666">if self.act</text>

  <!-- merge: two independent elbows into top of add (gap in middle, no shared segment) -->
  <path d="M 160 388 L 160 430 L 300 430 L 300 454" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 560 388 L 560 430 L 420 430 L 420 454" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="250" y="456" width="220" height="52" rx="8" fill="#2563eb"/>
